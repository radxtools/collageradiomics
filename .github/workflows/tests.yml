name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            constraints: "-c constraints-test.txt"
          - python-version: "3.11"
            constraints: ""
          - python-version: "3.12"
            constraints: ""
          - python-version: "3.13"
            constraints: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            module/pyproject.toml
            module/requirements.txt
            requirements-test.txt
            constraints-test.txt
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.constraints }} -r requirements-test.txt
          python -m pip install --no-build-isolation ${{ matrix.constraints }} -e './module[cli]'
          python -m pip check
      - name: Run core and distribution tests
        run: python -m pytest
      - name: Check types and style
        if: matrix.python-version == '3.11'
        run: |
          python -m mypy
          python -m ruff check module/collageradiomics module/_collageradiomics tests cli
          python -m ruff format --check module/collageradiomics module/_collageradiomics tests cli
