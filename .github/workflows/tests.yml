name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            module/pyproject.toml
            module/requirements.txt
            requirements-test.txt
            constraints-test.txt
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-test.txt -r requirements-test.txt
          python -m pip install --no-build-isolation -c constraints-test.txt -e ./module
          python -m pip check
      - name: Run core and distribution tests
        run: python -m pytest
